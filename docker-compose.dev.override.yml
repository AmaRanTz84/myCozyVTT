# Override locale per lo sviluppo su WSL2/ext4.
#
# Problema 1 — utenti: docker-compose.dev.yml monta ./frontend e ./backend dentro
# i container, che girano come "appuser". Su filesystem Linux i file montati
# appartengono all'utente dell'host (uid 1000), quindi i processi non possono
# scrivere: Vite fallisce sul file temporaneo di vite.config.ts, il backend
# fallirebbe sugli upload. Soluzione: girare con l'uid/gid dell'host.
#
# Problema 2 — node_modules: il compose originale usa volumi anonimi, popolati
# dall'immagine con i file di "appuser" e quindi non scrivibili da uid 1000
# (Vite ci scrive la cache .vite). Qui diventano volumi nominati, che prepariamo
# prima del primo avvio.
#
# Problema 3 — test: diverse suite del backend leggono file del monorepo
# risalendo di tre livelli da src/, cioe' <repo>/. Sull'host funziona; nel
# container il backend e' montato su /app, quindi quel calcolo produce "/" e i
# test cercano /frontend, /Examples, /backend/package.json. I tre mount in sola
# lettura qui sotto rimettono quei file dove i test li cercano.
# L'applicazione non li usa: servono solo a `npm test`.
#
# Uso: docker compose -f docker-compose.dev.yml -f docker-compose.dev.override.yml up
services:
  backend:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - backend_node_modules:/app/node_modules
      - ./frontend:/frontend:ro
      - ./Examples:/Examples:ro
      - ./backend:/backend:ro
  frontend:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - frontend_node_modules:/app/node_modules

volumes:
  backend_node_modules:
  frontend_node_modules:
